<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URBNSTEP | 我的收藏</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    <%- include('./layout/header'); -%>
    
    <main>
      <div class="container">
        <div class="row d-flex jc-center">
          <div class="col-6 col-md-4">
            <h1 class="h3 h4-md ta-center mb-32"><i class="bi bi-check-lg mr-16 mr-mb-8"></i>我的收藏</h1>
            <div class="text-md primary-400 bg-primary-100 p-16 mb-32 mb-md-24 d-flex ai-center">
              <i class="bi bi-truck mr-12"></i>
              <p class="d-flex f-md-column">
                <span>門市營業時間：</span>
                <span>週一至週五 10:00 - 22:00</span>
                </p>
            </div>
          <section>
            <div class="pb-32 mb-32 mb-md-24 section-lined">
              <div class="f-card d-flex">
                  <div class="mr-16">
                    <img src="/assets/images/product.png" alt="PLATFORM 404">
                  </div>            
                  <div class="flex-1">
                    <h2 class="h5 h6-sm mb-8">PLATFORM 404</h2>
                      <ul>
                        <li class="text-md text-sm mb-8"><span class="neutral-600 mr-12">尺寸</span>38</li>
                        <li class="text-md text-sm mb-8"><span class="neutral-600 mr-12">顏色</span>Navy</li>
                        <li class="h6 text-end text-sm-start">NT$2,600</li>
                      </ul>
                </div>
              </div>
              </div>
              <div class="pb-32 mb-32 mb-md-24 section-lined">
                <div class="f-card d-flex">
                  <div class="mr-16">
                    <img src="/assets/images/product-4.png" alt="BOOMLOK">
                  </div>            
                  <div class="flex-1">
                    <h2 class="h5 h6-sm mb-8">BOOMLOK</h2>
                    <ul>
                      <li class="text-md text-sm mb-8"><span class="neutral-600 mr-12">尺寸</span>38</li>
                      <li class="text-md text-sm mb-8"><span class="neutral-600 mr-12">顏色</span>White</li>
                      <li class="h6 text-end text-sm-start">NT$3,200</li>
                    </ul>
                  </div>
                </div>
              </div>
              <div class="pb-32 mb-32 mb-md-24 section-lined">
                <div class="f-card d-flex">
                  <div class="mr-16">
                    <img src="/assets/images/product-3.png" alt="MELTY KISS">
                  </div>            
                  <div class="flex-1">
                    <h2 class="h5 h6-sm mb-8">MELTY KISS</h2>
                    <ul>
                      <li class="text-md text-sm mb-8"><span class="neutral-600 mr-12">尺寸</span>38</li>
                      <li class="text-md text-sm mb-8"><span class="neutral-600 mr-12">顏色</span>Violet</li>
                      <li class="h6 text-end text-sm-start">NT$4,000</li>
                    </ul>
                  </div>
                </div>
              </div>                
            </section>
            <div class="d-flex jc-center">
              <button type="button" class="black-btn btn-w-md mb-64 mb-md-24">立即預約門市試穿
              </button>
            </div>
          </div>
        </div>
      </div>    
    </main>

    <%- include('./layout/footer'); -%>
    <script type="module" src="../main.js"></script>
  </body>
</html>
